projects:
- id: proj_fitcv
  name: FitCV
  url: https://github.com/longdang193/fitcv
  duration: 2026-03 — present
  domain_tags:
  - hr tech
  - cv generation
  - job matching
  - decision support
  responsibility_themes:
  - product design
  - pipeline architecture
  - matching logic
  - evaluation design
  - observability
  - process automation
  - preference optimization
  - ranking policy optimization
  - decision support
  skills:
  - python
  - llm workflow design
  - prompt engineering
  - ai agent orchestration
  - multi-agent orchestration
  - llm application development
  - ai-assisted software development
  - fastapi
  - sqlite
  - yaml configuration
  - workflow orchestration
  - system design
  - workflow automation
  - inverse optimization
  - preference learning
  - ranking policy optimization
  - decision support
  tech_stack:
  - 'Backend API: Python, FastAPI, Uvicorn'
  - 'Persistence: SQLite'
  - 'Execution: serialized in-process runtime; Redis + RQ supported for server workflows'
  - 'LLM runtime: OpenAI, OpenAI-compatible providers'
  - 'Frontend: React, TypeScript, Vite'
  - 'Configuration: YAML, environment variables'
  - 'Testing: pytest, Vitest, Playwright'
  business_value: >
    Built an AI-assisted job-matching and CV-generation pipeline that turns noisy job inputs into structured, reviewable
    outputs through staged filtering, shortlisting, ranking, evidence analysis, generation, validation, and artifact-backed
    inspection. The workflow limits unnecessary late-stage AI processing through deterministic gates and keeps run
    decisions, diagnostics, and generated outputs traceable for review.
  highlights:
  - Designed a staged workflow that filters, evaluates, and refines job opportunities before CV generation, keeping
    expensive late-stage processing focused on stronger candidates.
  - Combined deterministic eligibility rules, vector-based shortlisting, AI ranking, and evidence-based CV analysis
    so match decisions can be inspected before generation.
  - Added stage gates and validation checks to catch unsupported matches and output issues before final CV delivery.
  - Persisted run, job, stage, and artifact evidence so filtered, blocked, failed, and review-required outcomes
    remain inspectable.
  - Used AI coding agents in Git-tracked development workflows for implementation, multi-agent delegation, testing,
    independent review, and release verification, with evidence-backed changes and human-controlled acceptance.
  - Used configuration-owned policies and routing so matching and generation behavior can be adjusted without rewriting
    core stage logic.
  - Implemented a store-backed inverse-optimization and preference-learning workflow that converts user ratings
    into decision episodes, evaluates preference residuals, solves candidate policy updates, applies promotion gates,
    and protects personalized ranking from stale evidence or configuration changes.
